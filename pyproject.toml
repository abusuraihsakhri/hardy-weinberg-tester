[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardy-weinberg-tester"
version = "1.0.0"
description = "Hardy-Weinberg Equilibrium Tester — Chi-square, exact test, inbreeding, diagnostics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri", email = "abusuraihsakhri@github.com"}
]
keywords = ["hardy-weinberg", "genetics", "bioinformatics", "chi-square", "HWE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bioinformatics",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
test = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[project.scripts]
hwe-tester = "cli:main"

[tool.setuptools]
py-modules = ["hwe", "cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
